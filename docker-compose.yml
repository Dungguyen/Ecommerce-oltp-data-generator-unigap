services:

  postgres:

    image: postgres:17

    container_name: ecommerce_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: nguyendung
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ecommerce_oltp

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  app:

    build: .

    container_name: ecommerce_generator

    depends_on:
      - postgres

    env_file:
      - .env


  airflow-init:

    image: apache/airflow:2.10.5

    container_name: airflow_init

    depends_on:
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nguyendung:123456@postgres:5432/airflow_db

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true


  airflow-webserver:

    image: apache/airflow:2.10.5

    container_name: airflow_webserver

    restart: unless-stopped

    depends_on:
      - airflow-init

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nguyendung:123456@postgres:5432/airflow_db

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

    ports:
      - "8080:8080"

    command: webserver


  airflow-scheduler:

    image: apache/airflow:2.10.5

    container_name: airflow_scheduler

    restart: unless-stopped

    depends_on:
      - airflow-init

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://nguyendung:123456@postgres:5432/airflow_db

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

    command: scheduler


volumes:

  postgres_data: